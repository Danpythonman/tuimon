[package]
name = "tuimon"
version = "0.1.0"
description = "A terminal dashboard for CPU, memory, network, disks, processes, ports and system logs"
license = "MIT"
repository = "https://github.com/Danpythonman/tuimon"
readme = "README.md"
keywords = ["tui", "monitor", "system", "dashboard", "terminal"]
categories = ["command-line-utilities"]
rust-version = "1.88"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sysinfo = "0.39.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Byte counts and sample indices are converted to f64 for display/charting;
# precision loss beyond 2^52 is irrelevant here.
cast_precision_loss = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
